name: Visitor analytics checks

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
      - name: Validate PHP
        run: |
          php -l visitor_analytics_common.php
          php -l visitor_analytics.php
          php tests/visitor_analytics_common_test.php
      - name: Validate JavaScript
        run: |
          node --check assets/visitor-analytics-core.js
          node --check assets/visitor-analytics.js
          node tests/visitor_analytics_core.test.js
      - name: Validate integration contracts
        run: |
          python -m pip install --disable-pip-version-check pytest
          pytest tests/test_visitor_analytics_contracts.py tests/test_visitor_monitor.py -q
